<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧠 Second Brain</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 border-r border-zinc-800 p-4">
      <h1 class="text-xl font-bold mb-6 text-emerald-400">🧠 Second Brain</h1>
      <nav class="space-y-1">
        <button onclick="showFolder('journal')" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium capitalize bg-zinc-800 text-emerald-400" id="btn-journal">Journal</button>
        <button onclick="showFolder('projects')" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium capitalize text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900" id="btn-projects">Projects</button>
        <button onclick="showFolder('concepts')" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium capitalize text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900" id="btn-concepts">Concepts</button>
      </nav>
      <div class="mt-8 pt-4 border-t border-zinc-800">
        <p class="text-xs text-zinc-500">Built with Jordan 🤖</p>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6">
      <h2 class="text-lg font-semibold mb-4 capitalize" id="folder-title">Journal</h2>
      <div id="doc-list" class="space-y-2"></div>
    </main>
  </div>

  <script>
    let docs = { journal: [], projects: [], concepts: [] };
    
    async function loadDocs() {
      try {
        const res = await fetch('docs.json');
        docs = await res.json();
        showFolder('journal');
      } catch(e) {
        document.getElementById('doc-list').innerHTML = '<p class="text-zinc-500">No docs found. Check back soon!</p>';
      }
    }
    
    function showFolder(folder) {
      document.getElementById('folder-title').textContent = folder;
      document.getElementById('doc-list').innerHTML = '';
      
      // Update buttons
      ['journal','projects','concepts'].forEach(f => {
        const btn = document.getElementById('btn-' + f);
        if(f === folder) {
          btn.className = 'w-full text-left px-3 py-2 rounded-lg text-sm font-medium capitalize bg-zinc-800 text-emerald-400';
        } else {
          btn.className = 'w-full text-left px-3 py-2 rounded-lg text-sm font-medium capitalize text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900';
        }
      });
      
      const list = docs[folder] || [];
      if(list.length === 0) {
        document.getElementById('doc-list').innerHTML = '<p class="text-zinc-500">No documents yet.</p>';
        return;
      }
      
      list.forEach(doc => {
        const div = document.createElement('div');
        div.className = 'block p-4 rounded-lg bg-zinc-900 hover:bg-zinc-800 transition-colors cursor-pointer';
        div.innerHTML = '<h3 class="font-medium text-zinc-100">' + doc.title + '</h3><p class="text-sm text-zinc-500 mt-1">' + doc.date + '</p>';
        div.onclick = () => showDoc(doc);
        document.getElementById('doc-list').appendChild(div);
      });
    }
    
    function showDoc(doc) {
      document.getElementById('doc-list').innerHTML = '<a onclick="showFolder(\'' + doc.folder + '\')" class="text-emerald-400 hover:text-emerald-300 text-sm mb-4 inline-block cursor-pointer">← Back</a><h1 class="text-3xl font-bold mb-2">' + doc.title + '</h1><p class="text-zinc-500 text-sm mb-8">' + doc.date + '</p><pre class="whitespace-pre-wrap font-sans text-zinc-300">' + doc.content + '</pre>';
    }
    
    loadDocs();
  </script>
</body>
</html>
